name: Daily data refresh

# Free for public repos (unlimited Actions minutes). Runs once a day.
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily — adjust to taste
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab

permissions:
  contents: write          # needed so the bot can commit the refreshed JSON
  pages: write             # needed to deploy the refreshed site
  id-token: write          # needed for the Pages deployment

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          REDDIT_ID: ${{ secrets.REDDIT_ID }}
          REDDIT_SECRET: ${{ secrets.REDDIT_SECRET }}
        run: |
          cd pipeline
          python run_all.py

      - name: Commit refreshed data
        run: |
          git config user.name "valusense-bot"
          git config user.email "actions@github.com"
          git add site/data
          git diff --staged --quiet || git commit -m "chore: daily data refresh [skip ci]"
          git push

      # A GITHUB_TOKEN-authored push above does not itself trigger pages.yml's
      # `on: push` (GitHub suppresses workflow-triggered chaining), so deploy
      # the refreshed site directly here too.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
